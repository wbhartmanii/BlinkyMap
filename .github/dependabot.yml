version: 2
updates:
  # Python dependencies (requirements.txt — what blinkymap_server.py needs).
  # pyproject.toml is gone with the desktop app, so this no longer picks up
  # opencv/Pillow/matplotlib/vispy, none of which the plugin uses.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # GitHub Actions (tests.yml)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
